services:
  - type: web
    name: autonomous-trading-agent-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn trading_agent.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PYTHONPATH
        value: src
      - key: TRADING_MODE
        value: paper
      - key: SYMBOL
        value: BTCUSD
      - key: DEFAULT_MODEL_PATH
        value: models/btcusd_demo_nb.json
      - key: DEFAULT_CSV_PATH
        value: examples/mixed_training_prices.csv
